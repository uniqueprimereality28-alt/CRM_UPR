name: Daily database backup

on:
  schedule:
    # 21:30 UTC = 3:00 AM IST every day (low-traffic time)
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # lets you also click "Run workflow" manually on GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pymongo

      - name: Run backup
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python backend/scripts/backup_db.py

      - name: Remove backups older than 30 days
        run: |
          find backups -maxdepth 1 -type d -name "20*" -mtime +30 -exec rm -rf {} \;

      - name: Commit and push backup
        run: |
          git config user.name "crm-backup-bot"
          git config user.email "actions@github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated DB backup $(date -u +'%Y-%m-%d')"
            git push
          fi
